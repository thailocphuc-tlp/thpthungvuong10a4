<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diễn đàn Lớp 10A4 - THPT Hùng Vương</title>
  <!-- Thư viện Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; font-size: 24px; }
    
    /* Khu vực đăng nhập / Đăng ký */
    #auth-section, #forum-section { display: none; }
    .active-section { display: block !important; }
    
    input, select, textarea, button { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 14px; }
    button { background: #0ea5e9; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0284c7; }
    
    /* Bài đăng & tìm kiếm */
    .post-card { background: #334155; padding: 16px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #38bdf8; }
    .post-header { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
    .post-content { font-size: 15px; margin-bottom: 10px; line-height: 1.5; word-break: break-word; }
    .attachment-preview { margin-top: 8px; }
    .attachment-preview img { max-width: 100%; border-radius: 6px; max-height: 250px; }
    .attachment-preview a { color: #38bdf8; text-decoration: none; font-size: 13px; display: inline-block; margin-top: 4px; }
    
    .user-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #334155; padding: 10px 16px; border-radius: 8px; }
    .logout-btn { background: #ef4444; width: auto; padding: 6px 12px; margin: 0; }
    .logout-btn:hover { background: #dc2626; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎓 Diễn đàn Lớp 10A4 - THPT Hùng Vương</h1>

    <!-- PHẦN ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-section" class="active-section">
      <h3 style="margin-bottom: 12px; text-align: center; color: #cbd5e1;">Đăng nhập / Đăng ký tài khoản lớp</h3>
      <input type="email" id="email" placeholder="Nhập Email học sinh (VD: thailocphuc@gmail.com)" />
      <input type="password" id="password" placeholder="Mật khẩu" />
      <div style="display: flex; gap: 10px;">
        <button onclick="handleLogin()">Đăng nhập</button>
        <button onclick="handleSignUp()" style="background: #10b981;">Đăng ký mới</button>
      </div>
      <p id="auth-error" style="color: #ef4444; font-size: 13px; text-align: center; margin-top: 10px;"></p>
    </div>

    <!-- PHẦN CHÍNH CỦA DIỄN ĐÀN -->
    <div id="forum-section">
      <div class="user-bar">
        <span id="user-welcome" style="font-size: 14px; color: #38bdf8;">Xin chào!</span>
        <button class="logout-btn" onclick="handleLogout()">Đăng xuất</button>
      </div>

      <!-- Ô TẠO BÀI ĐĂNG MỚI -->
      <div style="background: #1e293b; border: 1px dashed #475569; padding: 16px; border-radius: 8px; margin-bottom: 20px;">
        <h3 style="margin-bottom: 10px; font-size: 15px; color: #38bdf8;">✍️ Đăng bài viết / Thảo luận mới</h3>
        <select id="postCategory">
          <option value="Thảo luận">Thảo luận chung</option>
          <option value="Toán">Môn Toán</option>
          <option value="Ngữ Văn">Môn Ngữ Văn</option>
          <option value="Tiếng Anh">Môn Tiếng Anh</option>
        </select>
        <textarea id="postContent" rows="3" placeholder="Bạn muốn chia sẻ điều gì với lớp 10A4 hôm nay?..."></textarea>
        
        <!-- Nút đính kèm file/ảnh -->
        <div style="margin-bottom: 10px;">
          <label style="font-size: 13px; color: #94a3b8; display: block; margin-bottom: 4px;">📎 Đính kèm hình ảnh hoặc tài liệu:</label>
          <input type="file" id="postAttachment" accept="image/*,.pdf,.doc,.docx,.pptx" style="padding: 6px;" />
        </div>
        
        <button onclick="createPost()">Đăng bài lên lớp</button>
      </div>

      <!-- THANH TÌM KIẾM & BỘ LỌC BÀI ĐĂNG -->
      <div style="display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;">
        <input type="text" id="searchInput" onkeyup="filterPosts()" placeholder="🔍 Tìm kiếm nội dung bài đăng..." style="flex: 2; margin: 0;" />
        <select id="categoryFilter" onchange="filterPosts()" style="flex: 1; margin: 0;">
          <option value="all">Tất cả chủ đề</option>
          <option value="Thảo luận">Thảo luận chung</option>
          <option value="Toán">Môn Toán</option>
          <option value="Ngữ Văn">Môn Ngữ Văn</option>
          <option value="Tiếng Anh">Môn Tiếng Anh</option>
        </select>
      </div>

      <!-- DANH SÁCH BÀI ĐĂNG -->
      <div id="posts-container">
        <p style="text-align: center; color: #94a3b8;">Đang tải danh sách bài viết...</p>
      </div>
    </div>
  </div>

  <script>
    // Khởi tạo kết nối Supabase
    const SUPABASE_URL = 'https://kafwlqcqqtvodzjgqdsw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable__kbhfIcsvg0LldYLgYEGcw_LWHEyOvq'; 
    // Lưu ý: Hãy thay chuỗi key an toàn của bạn vào biến SUPABASE_ANON_KEY nếu file cũ đang dùng key khác.
    
    // Khởi tạo client Supabase
    const supabase = window.supabase.createClient(
      'https://kafwlqcqqtvodzjgqdsw.supabase.co', 
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthZndsZWNxcXR2b2R6amdxZHN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAwMDAwMDB9...' // Đảm bảo dùng đúng Anon Key chuẩn từ Project Settings > API của bạn
    );

    // Kiểm tra trạng thái đăng nhập khi vừa mở trang
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        showForum(session.user);
      }
    });

    async function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      
      if (error) {
        document.getElementById('auth-error').innerText = "Lỗi đăng nhập: " + error.message;
        return;
      }
      showForum(data.user);
    }

    async function handleSignUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signUp({ email, password });
      
      if (error) {
        document.getElementById('auth-error').innerText = "Lỗi đăng ký: " + error.message;
        return;
      }
      alert("Đăng ký thành công! Bạn có thể đăng nhập ngay.");
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      document.getElementById('auth-section').classList.add('active-section');
      document.getElementById('forum-section').classList.remove('active-section');
    }

    function showForum(user) {
      document.getElementById('auth-section').classList.remove('active-section');
      document.getElementById('forum-section').classList.add('active-section');
      document.getElementById('user-welcome').innerText = `👤 Tài khoản: ${user.email}`;
      loadPosts();
    }

    // Tải tệp lên Supabase Storage
    async function uploadFile(file) {
      if (!file) return null;
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36.substring(2))}.${fileExt}`;
      const filePath = `uploads/${fileName}`;

      const { error } = await supabase.storage.from('forum-files').upload(filePath, file);
      if (error) {
        alert("Lỗi tải file: " + error.message);
        return null;
      }

      const { data } = supabase.storage.from('forum-files').getPublicUrl(filePath);
      return { url: data.publicUrl, name: file.name, type: file.type };
    }

    // Tạo bài đăng mới (Lưu ý: Bạn cần có sẵn bảng 'posts' gồm các cột: id, content, category, user_email, file_url, file_name, created_at)
    async function createPost() {
      const content = document.getElementById('postContent').value;
      const category = document.getElementById('postCategory').value;
      const fileInput = document.getElementById('postAttachment');
      
      if (!content.trim() && fileInput.files.length === 0) {
        alert("Vui lòng nhập nội dung hoặc đính kèm tệp!");
        return;
      }

      let fileData = null;
      if (fileInput.files.length > 0) {
        fileData = await uploadFile(fileInput.files[0]);
      }

      const { data: { user } } = await supabase.auth.getUser();

      const { error } = await supabase.from('posts').insert([
        {
          content: content,
          category: category,
          user_email: user.email,
          file_url: fileData ? fileData.url : null,
          file_name: fileData ? fileData.name : null
        }
      ]);

      if (error) {
        alert("Lỗi đăng bài: " + error.message);
        return;
      }

      document.getElementById('postContent').value = '';
      fileInput.value = '';
      loadPosts();
    }

    // Tải danh sách bài đăng từ Database
    async function loadPosts() {
      const { data: posts, error } = await supabase
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      const container = document.getElementById('posts-container');
      if (error) {
        container.innerHTML = `<p style="color: #ef4444;">Lỗi tải bài viết: ${error.message}</p>`;
        return;
      }

      if (posts.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: #94a3b8;">Chưa có bài đăng nào.</p>`;
        return;
      }

      container.innerHTML = posts.map(post => {
        let attachmentHtml = '';
        if (post.file_url) {
          if (post.file_url.match(/\.(jpeg|jpg|gif|png)$/i)) {
            attachmentHtml = `<div class="attachment-preview"><img src="${post.file_url}" alt="Đính kèm" /></div>`;
          } else {
            attachmentHtml = `<div class="attachment-preview"><a href="${post.file_url}" target="_blank">📥 Tải xuống tệp: ${post.file_name || 'Tài liệu đính kèm'}</a></div>`;
          }
        }

        return `
          <div class="post-card" data-category="${post.category}">
            <div class="post-header">
              <span><b>${post.user_email}</b> • <span style="color: #38bdf8;">[${post.category}]</span></span>
              <span>${new Date(post.created_at).toLocaleString('vi-VN')}</span>
            </div>
            <div class="post-content">${post.content}</div>
            ${attachmentHtml}
          </div>
        `;
      }).join('');
    }

    // Bộ lọc và tìm kiếm bài viết theo thời gian thực
    function filterPosts() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const selectedCategory = document.getElementById('categoryFilter').value;
      const postCards = document.querySelectorAll('.post-card');

      postCards.forEach(card => {
        const textContent = card.innerText.toLowerCase();
        const category = card.getAttribute('data-category');

        const matchesKeyword = textContent.includes(keyword);
        const matchesCategory = (selectedCategory === 'all') || (category === selectedCategory);

        if (matchesKeyword && matchesCategory) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
